  <script>
let currentIndex = 0;
let allImages = [];

async function loadWorks() {
  try {
    const response = await fetch("./works.json");

    if (!response.ok) {
      throw new Error("Nie udało się załadować works.json");
    }

    const works = await response.json();

    const categories = [
      "illustration",
      "charcoal",
      "journaling",
      "digital",
      "process"
    ];

    for (const category of categories) {
      const container = document.getElementById(category);
      const data = works[category];

      if (!container || !data) continue;

      const title = document.createElement("p");
      title.textContent = data.title;
      container.appendChild(title);

      for (const work of data.images) {
        const index = allImages.length;

        allImages.push({
          ...work,
          category
        });

        const thumbnail = document.createElement("img");

        thumbnail.src = work.src;
        thumbnail.loading = "lazy";
        thumbnail.className = "thumbnail";

        if (work.orientation === "horizontal") {
          thumbnail.classList.add("horizontal-img");
        }

        thumbnail.alt = work.alt || "";

        thumbnail.addEventListener("click", () => {
          openImage(index);
        });

        container.appendChild(thumbnail);
      }
    }
  } catch (error) {
    console.error("Błąd ładowania galerii:", error);
  }
}

function openImage(index) {
  if (!allImages.length) return;

  currentIndex = index;

  const image = allImages[currentIndex];
  const lightboxImage = document.getElementById("lightbox-img");

  lightboxImage.src = image.src;
  lightboxImage.alt = image.alt || "Enlarged image";

  lightboxImage.classList.toggle(
    "horizontal-img",
    image.orientation === "horizontal"
  );

  document.getElementById("lightbox").style.display = "flex";
}

function closeImage() {
  document.getElementById("lightbox").style.display = "none";
}

function prevImage(event) {
  event.stopPropagation();

  if (!allImages.length) return;

  currentIndex =
    (currentIndex - 1 + allImages.length) % allImages.length;

  openImage(currentIndex);
}

function nextImage(event) {
  event.stopPropagation();

  if (!allImages.length) return;

  currentIndex = (currentIndex + 1) % allImages.length;

  openImage(currentIndex);
}

// Obsługa przesuwania zdjęć na telefonie.

let touchStartX = 0;
let touchEndX = 0;

const lightboxElement = document.getElementById("lightbox");

lightboxElement.addEventListener("touchstart", function(event) {
  touchStartX = event.changedTouches[0].screenX;
}, false);

lightboxElement.addEventListener("touchend", function(event) {
  touchEndX = event.changedTouches[0].screenX;

  const distance = touchEndX - touchStartX;

  if (distance > 50) {
    prevImage(event);
  } else if (distance < -50) {
    nextImage(event);
  }
}, false);

// Ładowanie prac z JSON.

loadWorks();
</script>
